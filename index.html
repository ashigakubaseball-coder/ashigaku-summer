<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>芦学野球部 お知らせ</title>
<style>
:root{--m:#781028;--m2:#5a0c1e;--bg:#fbf7f4;--line:#e3d3d3;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-text-size-adjust:100%;}
body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:#2a2226;line-height:1.7;}
.wrap{max-width:640px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.06);}
.tag{background:var(--m);color:#fff;text-align:center;padding:14px;font-size:14px;letter-spacing:.25em;font-weight:700;}
.hero{background:linear-gradient(160deg,var(--m) 0%,var(--m2) 100%);color:#fff;padding:54px 28px 48px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.10),transparent 45%);}
.hero img{width:96px;height:96px;filter:brightness(0) invert(1);opacity:.95;margin-bottom:20px;position:relative;}
.kicker{font-size:15px;letter-spacing:.3em;opacity:.85;margin-bottom:18px;position:relative;}
.hero h1{font-size:38px;line-height:1.4;font-weight:800;position:relative;letter-spacing:.02em;}
.hero h1 .big{font-size:34px;display:inline-block;margin-bottom:6px;}
.lead{padding:34px 30px;font-size:16.5px;color:#3d3238;border-bottom:1px solid var(--line);}
.lead b{color:var(--m);}
.card{margin:30px 24px;border:2px solid var(--m);border-radius:14px;overflow:hidden;}
.card .date{background:var(--m);color:#fff;text-align:center;padding:16px;font-size:20px;font-weight:800;letter-spacing:.08em;}
.card .date .venue{display:block;font-size:14px;font-weight:600;letter-spacing:.1em;opacity:.9;margin-top:6px;}
.row{display:flex;align-items:center;gap:14px;padding:20px 22px;}
.row+.row{border-top:1px solid var(--line);}
.time{font-size:15px;color:var(--m);font-weight:700;white-space:nowrap;min-width:96px;}
.vs{font-size:20px;font-weight:800;color:#2a2226;}
.vs span{display:inline-block;background:#f3e7ea;color:var(--m);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle;}
.foot{text-align:center;padding:20px 24px 40px;font-size:16px;color:var(--m);font-weight:700;}
.divider{text-align:center;padding:26px 24px 8px;font-size:14px;letter-spacing:.25em;color:var(--m);font-weight:700;position:relative;}
.divider::before,.divider::after{content:"";display:inline-block;width:40px;height:1px;background:var(--m);vertical-align:middle;margin:0 12px;}
.notice{padding:14px 24px 46px;text-align:center;}
.notice img{width:100%;max-width:520px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
</style></head><body>
